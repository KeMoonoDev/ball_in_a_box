<html lang="en">

<head>

    <title>TITLE</title>
    <style>
        html,
        body,
        .initial_box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0px;
            padding: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
        }

</head>

<body>
    <button onclick=start_ball_in_a_box()>start game</button>
    <button onclick=stop_ball_in_a_box()>close game</button>

    <script src="js/audio.js"></script>
    <script src="js/ball_in_a_box.js"></script>
